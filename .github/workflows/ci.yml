name: RTL CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install open-source EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes verilator yosys make g++

      - name: Report tool versions
        run: |
          verilator --version
          yosys -V

      - name: Run lint, regressions, and synthesis
        run: make ci
