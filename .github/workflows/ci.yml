name: RTL CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pinned open-source EDA suite
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          version: "2026-10-19"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes make g++

      - name: Report tool versions
        run: |
          verilator --version
          yosys -V

      - name: Run lint, regressions, and synthesis
        run: make ci
